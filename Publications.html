<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Industrial & Computational Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        // Διαβάζουμε το χρώμα της προηγούμενης σελίδας
        if (sessionStorage.getItem('themeOrigin') === 'light') {
            document.body.classList.add('animate-bg-dark');
        }
        // Θέτουμε τη τρέχουσα σελίδα ως dark για τα επόμενα κλικ
        sessionStorage.setItem('themeOrigin', 'dark');
    </script>

    <canvas id="bg-canvas"></canvas>
    
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="Publications.html" class="active">Publications</a></li>
        </ul>
    </nav>
    
    <main class="content-page">
        <div class="content-container">
            <h1 class="page-title">Publications</h1>
            
            <section class="pub-category">
                <h2>Journals</h2>
                <ul class="pub-list">
                    <li>
                        <strong>Parametric Design in Modern Architecture: A Review</strong><br>
                        <em>International Journal of Computational Design</em>, 2023.<br>
                        <a href="#" class="pub-link">Read Article -></a>
                    </li>
                </ul>
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
<script>
        // 1. Ομαλή εμφάνιση όλης της περιοχής περιεχομένου
        const contentPage = document.querySelector('.content-page');
        contentPage.style.opacity = "0";
        window.addEventListener('load', () => {
            contentPage.style.transition = "opacity 0.5s ease-in-out";
            contentPage.style.opacity = "1";
        });
        
        // 2. Σταδιακή εμφάνιση (stagger) των κειμένων με GSAP
        gsap.from(".page-title, .pub-category h2, .pub-list li", {
            y: 30,             // Τα στοιχεία έρχονται από 30 pixels πιο κάτω
            opacity: 0,        // Ξεκινούν αόρατα
            duration: 1,       // Η κίνηση διαρκεί 1 δευτερόλεπτο
            stagger: 0.2,      // Κάθε στοιχείο εμφανίζεται 0.2 δευτερόλεπτα μετά το προηγούμενο
            ease: "power3.out", // Ομαλό φρενάρισμα στο τέλος της κίνησης
            delay: 0.4         // Ξεκινάει με 0.4 δευτερόλεπτα καθυστέρηση (για να προλάβει να γίνει η μετάβαση του φόντου)
        });
    </script>
</body>
</html>
