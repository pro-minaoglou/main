<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Industrial & Computational Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        @keyframes morphToWhite {
            0% { background-color: #050505; color: #ffffff; }
            100% { background-color: #ffffff; color: #050505; }
        }

        .animate-bg {
            animation: morphToWhite 2s ease-in-out forwards;
        }

        body, html {
            background-color: #ffffff;
            color: #050505;
        }

        .top-nav a { color: #888888 !important; }
        .top-nav a:hover, .top-nav a.active { color: #050505 !important; }
        .top-nav a::after { background-color: #050505 !important; }
        
        .content-page {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            overflow-y: auto;
            padding-top: 140px;
            padding-bottom: 80px;
            color: #050505 !important;
        }
        .content-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: left;
        }
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
            font-weight: 700;
        }
        
        /* Νέα προσαρμογή για το PDF */
        .pdf-container {
            width: 100%;
            /* Αναλογία για 5 σελίδες Α4 (προσαρμόζεται αυτόματα σε κινητά και PC). 
               Αν βλέπεις ότι κόβεται λίγο στο τέλος, άλλαξε το 7.3 σε 7.5 ή 7.6 */
            aspect-ratio: 1 / 7.3; 
            min-height: 100vh;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Κρύβει την εσωτερική μπάρα κύλισης αν δεν χρειάζεται */
            overflow: hidden; 
        }
    </style>
</head>
<body>
    <script>
        // Διαβάζουμε το χρώμα της προηγούμενης σελίδας
        if (sessionStorage.getItem('themeOrigin') === 'dark') {
            document.body.classList.add('animate-bg');
        }
        sessionStorage.setItem('themeOrigin', 'light');
    </script>

    <canvas id="bg-canvas"></canvas>
    
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="cv.html" class="active">CV</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="Publications.html">Publications</a></li>
        </ul>
    </nav>
    
    <main class="content-page">
        <div class="content-container">
            <h1 class="page-title">Curriculum Vitae</h1>
            
            <div class="pdf-container">
                <iframe src="cv.pdf#toolbar=0&view=FitH" scrolling="no" title="My CV">
                    <p>Ο περιηγητής σας δεν υποστηρίζει την προβολή PDF. <a href="cv.pdf">Κατεβάστε το PDF εδώ</a>.</p>
                </iframe>
            </div>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        const contentPage = document.querySelector('.content-page');
        contentPage.style.opacity = "0";
        window.addEventListener('load', () => {
            contentPage.style.transition = "opacity 0.5s ease-in-out";
            contentPage.style.opacity = "1";
        });
        
        window.getColor = function(p1, p2) {
            let factor = (p1.colorFactor + p2.colorFactor) / 2;
            let a = 0.15 + (0.55 * factor); 
            return `rgba(0, 0, 0, ${a})`;
        };
        
        gsap.from(".page-title, .pdf-container", {
            y: 30,
            opacity: 0,
            duration: 1,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.4
        });
    </script>
</body>
</html>
