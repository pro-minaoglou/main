<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Industrial & Computational Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        @keyframes morphToWhite {
            0% { background-color: #050505; color: #ffffff; }
            100% { background-color: #ffffff; color: #050505; }
        }

        .animate-bg {
            animation: morphToWhite 2s ease-in-out forwards;
        }

        body, html {
            background-color: #ffffff;
            color: #050505;
        }

        .top-nav a { color: #888888 !important; }
        .top-nav a:hover, .top-nav a.active { color: #050505 !important; }
        .top-nav a::after { background-color: #050505 !important; }
        
        .content-page {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            overflow-y: auto;
            padding-top: 140px;
            padding-bottom: 80px;
            color: #050505 !important;
        }
        .content-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: left;
        }
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
            font-weight: 700;
        }
        
        /* Νέα προσαρμογή για το PDF */
        .pdf-container {
            width: 100%;
            /* Αναλογία για 5 σελίδες Α4 (προσαρμόζεται αυτόματα σε κινητά και PC). 
               Αν βλέπεις ότι κόβεται λίγο στο τέλος, άλλαξε το 7.3 σε 7.5 ή 7.6 */
            aspect-ratio: 1 / 7.3; 
            min-height: 100vh;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Κρύβει την εσωτερική μπάρα κύλισης αν δεν χρειάζεται */
            overflow: hidden; 
        }
/* Container για το ψηφιακό CV */
.cv-digital-container {
    background: transparent;
    padding: 20px 0;
    font-family: 'Space Grotesk', sans-serif;
    color: #050505; /* Μαύρο κείμενο όπως το έχεις ήδη στην CV σελίδα */
}

/* Μορφοποίηση των τίτλων που θα παράγονται αυτόματα */
.cv-digital-container h1 {
    font-size: 2.2rem;
    margin-bottom: 5px;
    font-weight: 700;
    letter-spacing: -1px;
}

.cv-digital-container h2 {
    font-size: 1.2rem;
    color: #666666;
    margin-bottom: 30px;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.cv-digital-container h3 {
    font-size: 1.4rem;
    margin-top: 30px;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    padding-bottom: 5px;
    font-weight: 500;
}

/* Μορφοποίηση λιστών και κειμένου */
.cv-digital-container ul {
    list-style-type: square;
    padding-left: 20px;
    margin-bottom: 20px;
}

.cv-digital-container li {
    margin-bottom: 12px;
    line-height: 1.6;
    font-weight: 300;
}

.cv-digital-container p {
    line-height: 1.6;
    font-weight: 300;
    margin-bottom: 10px;
}

/* Στυλ για το κουμπί Download */
.download-btn {
    display: inline-block;
    background: #050505;
    color: #ffffff !important;
    padding: 12px 25px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 4px;
    transition: all 0.3s ease;
}

.download-btn:hover {
    background: #444444;
    transform: translateY(-2px);
}




    </style>
</head>
<body>
    <script>
        // Διαβάζουμε το χρώμα της προηγούμενης σελίδας
        if (sessionStorage.getItem('themeOrigin') === 'dark') {
            document.body.classList.add('animate-bg');
        }
        sessionStorage.setItem('themeOrigin', 'light');
    </script>

    <canvas id="bg-canvas"></canvas>
    
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="cv.html" class="active">CV</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="Publications.html">Publications</a></li>
        </ul>
    </nav>
    
    <main class="content-page">
        <div class="content-container">
            <h1 class="page-title">Curriculum Vitae</h1>
            
<div class="cv-digital-container" id="cv-content">
    <p style="text-align:center; color:#888;">Φόρτωση βιογραφικού...</p>
</div>

<div style="text-align: center; margin-top: 40px;">
    <a href="cv.pdf" download class="download-btn">Κατεβάστε το PDF</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    // Κώδικας που διαβάζει το cv.md και το τοποθετεί στη σελίδα
    fetch('cv.md')
        .then(response => {
            if (!response.ok) throw new Error("Το αρχείο cv.md δεν βρέθηκε");
            return response.text();
        })
        .then(text => {
            document.getElementById('cv-content').innerHTML = marked.parse(text);
        })
        .catch(err => {
            document.getElementById('cv-content').innerHTML = "<p>Σφάλμα κατά τη φόρτωση του βιογραφικού.</p>";
            console.error(err);
        });
</script>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        const contentPage = document.querySelector('.content-page');
        contentPage.style.opacity = "0";
        window.addEventListener('load', () => {
            contentPage.style.transition = "opacity 0.5s ease-in-out";
            contentPage.style.opacity = "1";
        });
        
        window.getColor = function(p1, p2) {
            let factor = (p1.colorFactor + p2.colorFactor) / 2;
            let a = 0.15 + (0.55 * factor); 
            return `rgba(0, 0, 0, ${a})`;
        };
        
        gsap.from(".page-title, .pdf-container", {
            y: 30,
            opacity: 0,
            duration: 1,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.4
        });
    </script>
</body>
</html>
