<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Σταθερό λευκό φόντο */
        body, html {
            background-color: #ffffff !important;
            color: #050505 !important;
        }
        
        .top-nav a { color: #888888 !important; }
        .top-nav a:hover, .top-nav a.active { color: #050505 !important; }
        .top-nav a::after { background-color: #050505 !important; }
        
        .content-page {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            overflow-y: auto;
            padding-top: 140px;
            padding-bottom: 80px;
            color: #050505 !important;
        }
        .content-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: left;
        }
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
            font-weight: 700;
        }
        .placeholder-text {
            text-align: center;
            color: #666666;
            font-weight: 300;
            margin-top: 50px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Home</a></li>

    <main class="content-page">

            <p class="placeholder-text">Το περιεχόμενο για τα Books σας θα προστεθεί εδώ.</p>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        window.getColor = function(p1, p2) {
            let factor = (p1.colorFactor + p2.colorFactor) / 2;
            let r = Math.floor(225 + (20 - 225) * factor);
            let g = Math.floor(225 + (20 - 225) * factor);
            let b = Math.floor(225 + (20 - 225) * factor);
            let a = 0.07 + (0.53 * factor); 
            return `rgba(${r}, ${g}, ${b}, ${a})`;
        };

        gsap.from(".page-title, .placeholder-text", {
            y: 30,
            opacity: 0,
            duration: 1,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.4
        });
    </script>
</body>
