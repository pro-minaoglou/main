<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Industrial & Computational Designer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Animation μετάβασης */
        @keyframes morphToWhite {
            0% { background-color: #050505; color: #ffffff; }
            100% { background-color: #ffffff; color: #050505; }
        }

        /* Η κλάση αυτή θα μπαίνει μόνο αν έρχεσαι από μαύρη σελίδα */
        .animate-bg {
            animation: morphToWhite 2s ease-in-out forwards !important;
        }

        /* Default κατάσταση (λευκή σελίδα) */
        body {
            background-color: #ffffff;
            color: #050505;
        }

        /* Ρυθμίσεις Μενού για Φωτεινό Φόντο */
        .top-nav a { color: #888888 !important; }
        .top-nav a:hover, .top-nav a.active { color: #050505 !important; }
        .top-nav a::after { background-color: #050505 !important; }
        
        /* Ρυθμίσεις Περιεχομένου */
        .content-page {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            overflow-y: auto;
            padding-top: 140px;
            padding-bottom: 80px;
            color: #050505 !important;
        }
        .content-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: left;
        }
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
            font-weight: 700;
        }
        .placeholder-text {
            text-align: center;
            color: #666666;
            font-weight: 300;
            margin-top: 50px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <script>
        // Λίστα με τις σελίδες που έχουν ΜΑΥΡΟ φόντο
        const darkPages = ['index.html', 'Publications.html'];
        const referrer = document.referrer;
        
        // Έλεγχος αν ο χρήστης ήρθε από μαύρη σελίδα ή αν άνοιξε το link απευθείας
        const isFromDarkPage = referrer === '' || darkPages.some(page => referrer.includes(page));

        if (isFromDarkPage) {
            document.body.classList.add('animate-bg');
        }
    </script>

    <canvas id="bg-canvas"></canvas>
    
    <nav class="top-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="Publications.html">Publications</a></li>
        </ul>
    </nav>
    
    <main class="content-page">
        <div class="content-container">
            <h1 class="page-title">Portfolio</h1>
            <p class="placeholder-text">Το περιεχόμενο του Portfolio σας θα προστεθεί εδώ.</p>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        // Fade in μόνο για το περιεχόμενο (όχι όλο το body) για να μην χαλάει το λευκό φόντο
        const contentPage = document.querySelector('.content-page');
        contentPage.style.opacity = "0";
        window.addEventListener('load', () => {
            contentPage.style.transition = "opacity 0.5s ease-in-out";
            contentPage.style.opacity = "1";
        });
        
        window.getColor = function(p1, p2) {
            let factor = (p1.colorFactor + p2.colorFactor) / 2;
            let a = 0.15 + (0.55 * factor); 
            return `rgba(0, 0, 0, ${a})`;
        };
        
        gsap.from(".page-title, .placeholder-text", {
            y: 30,
            opacity: 0,
            duration: 1,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.4
        });
    </script>
</body>
</html>
